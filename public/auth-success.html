<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed - Vaidya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Completely destroy the hash synchronously upon the very first tick
    if (window.location.hash) {
      window.location.hash = '';
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    // Also rigorously sweep localStorage just in case a previous session lingered
    const keysToRemove = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const key = window.localStorage.key(i);
      if (key && key.startsWith('sb-')) {
        keysToRemove.push(key);
      }
    }
    keysToRemove.forEach(k => window.localStorage.removeItem(k));
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    h1 { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-[#fafafa]">
  <div class="min-h-screen flex items-center justify-center relative overflow-hidden px-4">
    <!-- Soft background elements -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-400/10 rounded-full blur-3xl -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-400/10 rounded-full blur-3xl -z-10"></div>

    <div class="w-full max-w-md bg-white border border-zinc-100 shadow-[0_8px_30px_rgba(0,0,0,0.08)] rounded-[24px] p-8 sm:p-10 text-center relative z-10 transition-all duration-700 opacity-0 translate-y-4" id="card">
      <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      
      <h1 class="text-2xl sm:text-3xl font-semibold text-zinc-900 mb-3">
        Email Confirmed!
      </h1>
      
      <p class="text-zinc-500 text-[15px] leading-relaxed mb-8">
        Your account is securely verified. You can now close this tab safely and return to the original tab you used to sign up. 
        <br/><br/>
        <span class="font-medium text-emerald-600">Your original tab will log you in automatically!</span>
      </p>

      <div class="pt-6 border-t border-zinc-100 flex flex-col gap-3">
        <p class="text-sm text-zinc-400">Lost your original tab?</p>
        <a href="/login" class="inline-flex items-center justify-center w-full h-12 rounded-xl bg-zinc-900 text-white font-medium hover:bg-zinc-800 transition-colors">
          Click here to sign in manually
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Fade in animation
    setTimeout(() => {
      const card = document.getElementById('card');
      if (card) {
        card.classList.remove('opacity-0', 'translate-y-4');
        card.classList.add('opacity-100', 'translate-y-0');
      }
    }, 100);
  </script>
</body>
</html>
