<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed - Vaidya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Completely destroy the hash synchronously upon the very first tick
    if (window.location.hash) {
      window.location.hash = '';
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    // Also rigorously sweep localStorage just in case a previous session lingered
    const keysToRemove = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const key = window.localStorage.key(i);
      if (key && key.startsWith('sb-')) {
        keysToRemove.push(key);
      }
    }
    keysToRemove.forEach(k => window.localStorage.removeItem(k));
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    h1 { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-[#fafafa] text-zinc-900 selection:bg-emerald-500/20 overflow-hidden">
  <div class="min-h-[100dvh] flex flex-col items-center justify-center relative p-4 sm:p-0">
    
    <!-- Elegant Pastel Blobs (Mix-blend multiply on white makes them look incredibly premium and soft) -->
    <div class="absolute top-[-10%] right-[-10%] w-[80vw] sm:w-[500px] h-[80vw] sm:h-[500px] bg-violet-400/20 blur-[80px] sm:blur-[100px] rounded-full pointer-events-none mix-blend-multiply"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[80vw] sm:w-[500px] h-[80vw] sm:h-[500px] bg-emerald-400/20 blur-[80px] sm:blur-[100px] rounded-full pointer-events-none mix-blend-multiply"></div>

    <!-- Frosted Glass Card to give depth -->
    <div class="w-full max-w-[calc(100vw-32px)] sm:max-w-[420px] bg-white/70 backdrop-blur-2xl border border-white shadow-[0_24px_50px_rgba(0,0,0,0.06),_0_0_0_1px_rgba(255,255,255,0.6)_inset] rounded-[28px] sm:rounded-[32px] p-6 sm:p-10 text-center relative z-10 transition-all duration-700 opacity-0 translate-y-4" id="card">
      
      <!-- High-Contrast Popping Icon -->
      <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_8px_20px_rgba(16,185,129,0.3)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white drop-shadow-sm">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
      
      <h1 class="text-2xl sm:text-[28px] font-bold tracking-tight text-zinc-900 mb-3" style="font-family: 'Outfit', sans-serif;">
        Email Confirmed!
      </h1>
      
      <p class="text-[15px] text-zinc-500 mb-6 leading-relaxed">
        Your account has been successfully verified. You may now close this tab and return to the original tab to continue.
      </p>

      <!-- Vibrant Highlight Pill -->
      <div class="w-full bg-gradient-to-r from-emerald-500/10 via-emerald-400/5 to-teal-500/10 border border-emerald-500/20 rounded-2xl p-4 mb-8 transition-transform hover:-translate-y-0.5">
        <span class="inline-block font-semibold text-emerald-700 text-[14px]">Your original tab will log you in automatically!</span>
      </div>

      <div class="pt-6 border-t border-zinc-200/60 flex flex-col gap-3 mt-1">
        <p class="text-[13px] font-semibold text-zinc-400 tracking-wide uppercase">Lost your original tab?</p>
        
        <!-- Popping "Sign In Manually" Button -->
        <a href="/login" class="inline-flex items-center justify-center w-full h-[52px] rounded-xl bg-gradient-to-b from-zinc-800 to-zinc-950 text-white font-medium hover:from-zinc-700 hover:to-zinc-900 transition-all duration-300 hover:scale-[1.03] active:scale-[0.98] hover:shadow-[0_12px_24px_rgba(0,0,0,0.15)] text-[15px] group">
          Sign in manually
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-2 w-4 h-4 transition-transform group-hover:translate-x-1">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Fade in animation
    setTimeout(() => {
      const card = document.getElementById('card');
      if (card) {
        card.classList.remove('opacity-0', 'translate-y-4');
        card.classList.add('opacity-100', 'translate-y-0');
      }
    }, 50);
  </script>
</body>
</html>
